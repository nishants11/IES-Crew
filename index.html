<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IES Crew · Northway Fuel & Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A;--blue:#236CFF;--blue-ink:#1A56D6;--blue-soft:#EAF1FF;
  --amber:#F5A623;--amber-ink:#8A5A00;--amber-bg:#FFF5E3;--amber-line:#F3D08F;
  --green:#1E9E6A;--green-ink:#157A51;--green-bg:#E5F6EE;--green-line:#A8DEC6;
  --red:#D64545;--red-bg:#FCEBEB;--brown:#A66A00;
  --bg:#F6F8FC;--surface:#FFFFFF;--surface-2:#F3F6FB;--line:#D5DCE8;--line-2:#E6EBF3;
  --text:#1B2333;--muted:#5B6579;--faint:#8C95A8;
  --shadow:0 1px 2px rgba(11,31,58,.05);
  --r-lg:12px;--r:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}h2{font-size:18px}h3{font-size:15px}
p{margin:0}a{color:var(--blue-ink)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.spacer{flex:1}
.stack>*+*{margin-top:14px}
.v-cost{color:var(--red)!important}.v-inv{color:var(--brown)!important}.v-good{color:var(--green-ink)!important}
/* top bar: white */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;color:var(--text);height:58px;display:flex;align-items:center;padding:0 18px;gap:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{font-weight:700;white-space:nowrap}
.brand .co{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sep{width:1px;height:20px;background:var(--line)}
.appname{color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);white-space:nowrap}
.avatar-btn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 12px 4px 4px}
.avatar-btn:hover{background:var(--surface-2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex:none;position:relative}
.av.d{background:#2F7D6B}.av.m{background:#3C63B8}.av.p{background:#8A5A9E}.av.s{background:#B06A2C}
.who{text-align:left;line-height:1.15}.who .n{font-size:13px;font-weight:600}.who .r{font-size:11.5px;color:var(--muted)}
.menu{position:absolute;right:14px;top:54px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(11,31,58,.16);width:300px;padding:6px;z-index:60}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border:0;background:transparent;border-radius:8px}
.menu button:hover,.menu button[aria-current="true"]{background:var(--surface-2)}
.menu .mt{font-weight:600;font-size:13px}.menu .ms{font-size:12px;color:var(--muted)}
.menu .badge{margin-left:auto}
/* cards with navy header strip */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.ch{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:44px}
.ch h3{font-size:14px;font-weight:700;color:#fff}
.ch .ci{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ch .ci svg{width:14px;height:14px}
.ch .meta{font-size:12px;color:#AFC0DA}
.ch .btn{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.ch .btn:hover{background:rgba(255,255,255,.1)}
.pad{padding:18px}.pad-s{padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue-ink);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(26,86,214,.35)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.badge.amber{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber-line)}
.badge.green{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.badge.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.badge.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.badge.brown{background:#FBF1DF;color:var(--brown);border-color:#EBD3A6}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #C9D8FB;background:var(--blue-soft);color:var(--blue-ink);font-weight:600;font-size:12px;padding:1px 8px;border-radius:6px;margin:0 1px;vertical-align:baseline}
.chip:hover{border-color:var(--blue)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th button{background:none;border:0;padding:0;font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.num{text-align:right;font-weight:700}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.45}
label.fld{display:block}label.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.switch{position:relative;width:40px;height:23px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:12px;background:#C7CFDC;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(17px)}
.switch input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-2);background:#EEF1F6;padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue-soft);border-top-color:var(--blue);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}*{transition:none!important}}
.toast-wrap{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#fff;color:var(--text);border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 14px;border-radius:10px;box-shadow:0 8px 28px rgba(11,31,58,.14);max-width:340px;font-size:13px;display:flex;gap:10px;align-items:center}
.toast button{background:var(--blue-soft);border:0;color:var(--blue-ink);border-radius:6px;padding:3px 8px;font-weight:600;font-size:12px}
.sim{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80}
.sim>button{border:1px solid var(--line);background:#fff;color:var(--faint);font-size:12px;font-weight:600;border-radius:8px;padding:6px 10px;opacity:.8}
.sim>button:hover{opacity:1;color:var(--muted)}
.sim .menu{left:0;right:auto;top:auto;bottom:40px;width:300px}
.sim .menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
footer.foot{text-align:center;color:var(--faint);font-size:11.5px;padding:18px 16px 60px}
.scrim{position:fixed;inset:0;background:rgba(11,31,58,.38);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px}
.modal h2{margin-bottom:6px}
/* label-value money rows */
.kv{display:grid;grid-template-columns:1fr auto;column-gap:16px}
.kv>div{padding:8px 0}
.kv>div:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv>.dv{grid-column:1/-1;border-top:1px solid var(--line-2);padding:0;margin:6px 0}
.kv>.dvp{display:none}
.kv .lbl{font-weight:400}
/* ---------- Dana (phone) ---------- */
.phone-stage{display:flex;justify-content:center;padding:26px 16px 10px}
.phone{width:390px;max-width:100%;height:min(800px,calc(100vh - 130px));min-height:600px;background:var(--bg);border:1px solid var(--line);border-radius:30px;box-shadow:0 16px 50px rgba(11,31,58,.12);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-head{background:#fff;padding:18px 18px 12px;border-bottom:1px solid var(--line-2)}
.ph-head .store{font-size:12.5px;color:var(--muted);font-weight:500}
.ph-body{flex:1;overflow-y:auto;padding:14px}
.ph-tabs{display:flex;border-top:1px solid var(--line);background:#fff}
.ph-tabs button{flex:1;border:0;background:transparent;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.ph-tabs button[aria-current="true"]{color:var(--blue)}
.ph-tabs svg{width:22px;height:22px}
.ph-tabs .pip{position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--amber)}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:4px 2px 8px}
.shift{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.shift:last-child{border-bottom:0}
.shift .t{font-size:12.5px;color:var(--muted);font-weight:500}
.shift .nm{font-weight:600}.shift .sub{font-size:12px;color:var(--muted)}
.shift.out .nm{text-decoration:line-through;color:var(--faint)}
.shift.new{background:var(--green-bg)}
.upd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.upd.amber{border-color:var(--amber-line);box-shadow:inset 4px 0 0 var(--amber)}
.upd.green{box-shadow:inset 4px 0 0 var(--green)}
.upd .when{font-size:11.5px;color:var(--faint);margin-bottom:4px}
.upd .ttl{font-weight:600;line-height:1.35}
.upd .body{margin-top:4px;color:var(--muted);font-size:13px}
.upd .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status-line{display:flex;align-items:center;gap:8px;color:var(--blue-ink);font-weight:600;font-size:13px;margin-top:8px}
.ok-line{display:flex;align-items:center;gap:6px;color:var(--green-ink);font-weight:600;margin-top:8px}
.sheet{background:#fff;width:100%;max-width:390px;border-radius:18px 18px 0 0;padding:10px 20px 24px;max-height:82%;overflow:auto}
.phone .scrim{position:absolute}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.why{margin:10px 0 0;padding:0;list-style:none}
.why li{padding:9px 0 9px 26px;border-bottom:1px solid var(--line-2);position:relative}
.why li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.why li.pick::before{background:var(--green)}
.thread-item{display:flex;gap:10px;align-items:center;padding:12px;border:0;border-bottom:1px solid var(--line-2);background:#fff;width:100%;text-align:left}
.bubbles{display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13.5px;line-height:1.4}
.bub.in{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.bub.out{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.crew{background:var(--blue-soft);color:var(--text);align-self:flex-end;border-bottom-right-radius:5px}
.bub-from{font-size:11px;color:var(--faint);margin:0 4px}.bub-from.r{align-self:flex-end}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line-2);background:#fff}
.compose input{border-radius:999px}
.emp{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line-2)}
.emp:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700}
.stepper input{width:70px;text-align:center}
.inv-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.inv-row:last-child{border-bottom:0}
.meter{height:6px;border-radius:3px;background:var(--line-2);position:relative;overflow:hidden;grid-column:1/-1}
.meter i{position:absolute;top:0;bottom:0;left:0}
/* ---------- desktop shell ---------- */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 58px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.side .co{padding:4px 10px 14px;font-size:12px;color:var(--muted)}
.side .co b{display:block;color:var(--text);font-size:13.5px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--muted);text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--amber);color:#3D2800;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.main{padding:24px 28px 30px;min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead p{margin-top:4px}
.crumb{font-size:12.5px;margin-bottom:6px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.inner{gap:0}
.tile{padding:14px 16px;background:#fff;border:0;text-align:left;display:block;width:100%;border-right:1px solid var(--line-2)}
.tiles.inner .tile:last-child{border-right:0}
.tiles:not(.inner) .tile{border:1px solid var(--line);border-radius:var(--r-lg)}
button.tile:hover{background:var(--surface-2)}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.ask{position:sticky;top:76px;display:flex;flex-direction:column;height:calc(100vh - 100px);min-height:480px}
.ask-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.q{align-self:flex-end;background:var(--blue-soft);padding:8px 12px;border-radius:12px 12px 4px 12px;max-width:88%}
.a{line-height:1.55}.a .chip{cursor:pointer}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:13px}
.sugg button:hover{border-color:var(--blue);color:var(--blue-ink)}
.ask-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line-2)}
.bar{height:6px;border-radius:3px;background:var(--line-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--blue)}
.bar.warn i{background:var(--amber)}.bar.good i{background:var(--green)}.bar.bad i{background:var(--red)}
.close-card{display:flex;gap:16px;align-items:center}
.ring{width:54px;height:54px;flex:none}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.filters select,.filters input{width:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.two-1{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.appr{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.appr:last-child{border-bottom:0}
.note-q{margin-top:8px;padding:9px 12px;border-left:3px solid var(--amber-line);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px}
.act-row td{font-size:13px}
.act-row.undone td{color:var(--faint)}
.act-row.undone td .what{text-decoration:line-through}
.act-row.flash td{animation:fl 2.2s ease-out}
@keyframes fl{0%{background:var(--blue-soft)}100%{background:transparent}}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mk .card{display:flex;flex-direction:column;padding:16px}
.mk .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.setting{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.setting:last-child{border-bottom:0}
.setting select{width:auto;min-width:120px}
.setting input[type=number]{width:96px}
.setting .grp{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding-top:4px}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pv b{display:block;font-size:22px;font-weight:700}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:var(--line-2)}
.stackbar i{display:block;height:100%}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}

/* ================= agent: cover ================= */
function quoteEmployee(e, shift, st){
  const h = shift.end-shift.start, wk = weekHours(e);
  const reg = Math.max(0, Math.min(h, 40-wk)), ot = h-reg;
  const wages = reg*e.rate + ot*e.rate*1.5, otPrem = ot*e.rate*0.5;
  const fw = FAIR_WORKWEEK[st.city] ? e.rate : 0;
  const home = store(e.store);
  return { type:"employee", empId:e.id, name:e.name, pron:e.pron, home:e.store, entity:home.entity, rate:e.rate, weekBefore:wk, storesWorked:Object.keys(e.hours).map(Number),
    hours:h, reg, ot, wages, otPrem, fw, fee:0, total:wages+fw, crossEntity:home.entity!==st.entity, crossState:home.state!==st.state };
}
function quotePartner(p, shift){
  const h = shift.end-shift.start;
  return { type:"partner", partner:p.id, name:p.name, maker:p.maker, home:null, entity:p.maker, rate:p.rate, hours:h, reg:h, ot:0, wages:h*p.rate, otPrem:0, fw:0, fee:p.fee, total:h*p.rate+p.fee, crossEntity:false, crossState:false, eta:p.eta };
}
function findCover(c){
  const st = store(c.store), shift = c.shift;
  const pool = Object.values(S.emps).filter(e=>e.id!==c.empId);
  const same = pool.filter(e=>e.store===st.id), city = pool.filter(e=>e.store!==st.id && store(e.store).city===st.city && store(e.store).state===st.state);
  const excluded = [], quotes = [];
  for (const e of [...same, ...city]) {
    if (shift.cert && !e.fuel) { excluded.push({name:e.name, text:`${first(e.name)} isn't fuel-till certified.`}); continue; }
    if (e.busy) { excluded.push({name:e.name, text:`${first(e.name)} ${e.busy}.`}); continue; }
    if (e.availFrom && e.availFrom>shift.start) { excluded.push({name:e.name, text:`${first(e.name)} can't start until ${hr(e.availFrom)}.`}); continue; }
    quotes.push(quoteEmployee(e, shift, st));
  }
  const inst = S.market.installed.shiftfill;
  if (inst && S.sam.published && (inst.stores==="all" || inst.stores.includes(st.id))) quotes.push(quotePartner(PARTNERS.shiftfill, shift));
  quotes.sort((a,b)=>a.total-b.total);
  return { quotes, excluded };
}
function decide(q, st, sickAuto){
  const s = S.settings, mgr = managerRole(st.id);
  if (s.mode==="suggest") return {who:mgr, why:"suggest"};
  if (q.crossState && s.crossState==="ask") return {who:"mike", why:"state"};
  if (s.mode!=="auto") {
    if (q.crossEntity && s.crossEntity!=="auto") return {who: s.crossEntity==="cfo" ? "mike" : mgr, why:"entity"};
    if (q.otPrem>0 && (!s.autoFillOT || q.otPrem>=s.otThreshold)) return {who:mgr, why:"ot"};
    if (!sickAuto) return {who:mgr, why:"sick"};
  }
  return null;
}
function reasonText(c){
  const q = c.quotes[c.pick], p = q.pron==="she"?"she":"he";
  const extra = c.sick.status==="pending" ? ` ${first(emp(c.empId).name)}'s sick leave is included.` : "";
  switch (c.decision?.why) {
    case "entity": return `${p} works for another Northway entity.`+extra;
    case "ot": return (S.settings.autoFillOT ? `the overtime premium is over your ${money(S.settings.otThreshold)} limit.` : "it includes overtime.")+extra;
    case "state": return `${p} works in another state.`+extra;
    case "sick": return `${first(emp(c.empId).name)}'s sick leave needs approval.`;
    default: return "you review every cover."+extra;
  }
}

function eventCallout(empId){
  const e = emp(empId);
  if (S.callouts.some(c=>c.empId===empId && (empId==="maria" ? !["open","undone"].includes(c.status) : ["searching","texting","pending"].includes(c.status)))) { toast(`${first(e.name)}'s call-out is already in progress.`); return; }

  S.callouts.push(c);
  store(e.store).callouts++;

}
function jobCoverSearch({id}){
  const c = S.callouts.find(x=>x.id===id); if (!c) return;
  const e = emp(c.empId), st = store(c.store), s = S.settings;
  // 1. sick leave
  if (e.sick >= c.sick.hours && s.autoSick && s.mode!=="suggest") {
    e.sick -= c.sick.hours; c.sick.status="approved";
    const a = act({who:"Crew",what:`Approved sick leave for ${e.name} (${storeLabel(st.id)}), ${c.sick.hours}h`,reason:`Balance covered the shift (${e.sick+c.sick.hours}h → ${e.sick}h)`,rule:"Sick leave v2.1",amount:c.sick.pay,acct:"Intuit",store:st.id,kind:"sick",calloutId:c.id});
    a.entryIds=[post(st.id,"Sick pay",c.sick.pay,a.id)];
    if (c.empId==="maria") sms("maria","crew",`Feel better, Maria. Your sick leave for today (6 AM–2 PM) is approved. You have ${e.sick}h left.`);
  } else c.sick.status = e.sick >= c.sick.hours ? "pending" : "unpaid";
  // 2-6. candidates
  const {quotes, excluded} = findCover(c);
  c.quotes = quotes; c.excluded = excluded;
  if (!quotes.length) { c.status="open"; c.phase=""; act({who:"Crew",what:`No qualified cover found for ${e.name}'s ${c.shift.label} shift`,reason:excluded.map(x=>x.text).join(" "),rule:"Cover selection v3.2",amount:null,acct:"Intuit",store:st.id}); return; }
  c.pick = 0;
  const q = quotes[0];
  c.status = "texting"; c.phase = q.type==="partner" ? "Requesting a ShiftFill worker..." : `Texting ${q.name}...`;
  if (q.type==="employee" && S.threads[q.empId]) sms(q.empId,"crew",`Hi ${first(q.name)}, can you cover ${storeLabel(st.id)} (${st.name}) today, ${c.shift.label}? Reply YES or NO.`);
  schedule("coverAccept", 1500, {id});
}
function jobCoverAccept({id}){
  const c = S.callouts.find(x=>x.id===id); if (!c) return;
  const q = c.quotes[c.pick], st = store(c.store);
  if (q.type==="employee" && S.threads[q.empId]) sms(q.empId,q.empId,"YES, I can do it.");
  c.decision = c.chosenBy ? null : decide(q, st, c.sick.status!=="pending");
  if (c.decision) {
    c.status = "pending"; c.phase = "";
    S.approvals.push({ id:uid("ap"), kind:"cover", ref:c.id, approver:c.decision.who, status:"pending", ts:Date.now(), store:st.id });
    act({who:"Crew",what:`Proposed ${q.name} to cover ${emp(c.empId).name} (${storeLabel(st.id)})`,reason:whySummary(c),rule:"Cover selection v3.2 · approval rules v1.3",amount:q.total,acct:"Intuit",store:st.id});
    if (c.decision.who==="mike" && S.role!=="mike") toast("A cover for "+storeLabel(st.id)+" is waiting in Approvals.");
  } else finalizeCover(c, c.chosenBy || null);
}
function whySummary(c){
  const q = c.quotes[c.pick], st = store(c.store);
  const parts = c.excluded.map(x=>x.text);
  if (q.type==="employee") {
    if (q.ot>0) parts.push(`${first(q.name)} has ${q.weekBefore}h this week across ${q.storesWorked.map(storeLabel).join(" and ")}, so ${q.reg===0?"the whole shift":q.ot+"h"} is overtime (${money(q.otPrem)} premium).`);
    else parts.push(`${first(q.name)} stays under 40h (${q.weekBefore+q.hours}h), no overtime.`);
    if (q.crossEntity) parts.push(`Employed by ${q.entity}: intercompany charge applies.`);
  } else parts.push(`${q.maker} can place a vetted worker in ${q.eta} at ${money(q.rate)}/h with no overtime.`);
  parts.push(FAIR_WORKWEEK[st.city] ? `${st.city} Fair Workweek pay applies to internal covers.` : `No schedule-change pay law in ${st.city}.`);
  if (c.quotes[c.pick+1]) parts.push(`Next option: ${c.quotes[c.pick+1].name} at ${money(c.quotes[c.pick+1].total)}.`);
  return parts.join(" ");
}
function finalizeCover(c, approvedBy){
  const q = c.quotes[c.pick], st = store(c.store), e = emp(c.empId);
  if (c.sick.status==="pending") {
    e.sick -= c.sick.hours; c.sick.status="approved";
    const a = act({who:approvedBy||"Crew",what:`Approved sick leave for ${e.name} (${storeLabel(st.id)}), ${c.sick.hours}h`,reason:`Balance ${e.sick+c.sick.hours}h → ${e.sick}h`,rule:"Sick leave v2.1",amount:c.sick.pay,acct:approvedBy?"CFO":"Intuit",store:st.id,kind:"sick",calloutId:c.id});
    a.entryIds=[post(st.id,"Sick pay",c.sick.pay,a.id)];
    if (c.empId==="maria") sms("maria","crew",`Feel better, Maria. Your sick leave for today is approved. You have ${e.sick}h left.`);
  }
  if (approvedBy) act({who:approvedBy,what:`Approved ${q.name} to cover ${storeLabel(st.id)}, ${c.shift.label}`,reason:c.decision?`Required: ${({entity:"cover from another entity",ot:"overtime above limit",state:"cover from another state",suggest:"all covers reviewed",sick:"sick leave approval"})[c.decision.why]}`:"Chosen by store manager",rule:"Approval rules v1.3",amount:q.total,acct:"CFO",store:st.id});
  const who = q.type==="partner" ? "ShiftFill agent" : "Crew";
  const a = act({who,what:`Covered ${e.name}'s ${c.shift.label} shift with ${q.type==="partner"?"a ShiftFill worker":q.name}`,reason:whySummary(c),rule:q.type==="partner"?"ShiftFill fill v1.0 · Cover selection v3.2":"Cover selection v3.2",amount:q.total,acct:q.type==="partner"?"Partner":"Intuit",store:st.id,kind:"cover",calloutId:c.id});
  if (q.type==="employee") {
    a.entryIds.push(post(st.id,"Labour: cover shift",q.wages-q.otPrem,a.id,{memo:q.name}));
    if (q.otPrem>0) a.entryIds.push(post(st.id,"Labour: overtime premium",q.otPrem,a.id,{memo:q.name}));
    if (q.fw>0) a.entryIds.push(post(st.id,"Labour: Fair Workweek premium",q.fw,a.id,{memo:q.name}));
    if (q.crossEntity) {
      const ic = act({who:"Crew",what:`Intercompany charge: ${st.entity} owes ${q.entity}`,reason:`${q.name} is employed by ${q.entity}; ${storeLabel(st.id)} belongs to ${st.entity}`,rule:"Intercompany v2.3",amount:q.wages,acct:"Intuit",store:st.id,kind:"ic"});
      ic.entryIds.push(post(st.id,`Intercompany payable to ${q.entity}`,q.wages,ic.id,{bs:true}));
    }
    const ce = emp(q.empId); ce.hours[st.id] = (ce.hours[st.id]||0)+q.hours;
    if (S.threads[q.empId]) sms(q.empId,"crew",`You're confirmed for ${storeLabel(st.id)} today, ${c.shift.label}. Ask for ${first(MANAGERS[st.id]||"the manager")} when you arrive. Thank you!`);
  } else {
    a.entryIds.push(post(st.id,"Contract labour: ShiftFill",q.wages,a.id));
    a.entryIds.push(post(st.id,"Marketplace fee: ShiftFill",q.fee,a.id));

/* ================= agent: stock-out risk ================= */
const invItem = (storeId, sku) => S.inv[storeId]?.items.find(i=>i.sku===sku);
const orderTotal = o => Math.round(o.lines.reduce((a,l)=>a+l.qty*l.cost,0)*100)/100;
function eventHeatwave(){
  if (S.stock) { toast("This weekend's stock plan for Store 23 is already in place."); return; }
  S.stock = { id:uid("stk"), store:23, status:"forecasting", ts:Date.now(), transfers:[], orderId:null, spike:false, shortfalls:[], protected:0 };
  S.feed.unshift({id:uid("f"),kind:"stock",ts:Date.now()});
  schedule("stockPlan", 2600, {}); save(); render();
}
function jobStockPlan(){
  const k = S.stock; if (!k) return;
  const st = store(k.store), s = S.settings, items = S.inv[k.store].items;
  const hasSS = !!S.market.installed.stocksense;
  if (hasSS) {
    k.spike = true;
    items.forEach(i=>{ if (i.sku==="ice"||i.sku==="drinks") i.forecast = i.normal*3; if (i.sku==="water") i.forecast = Math.round(i.normal*1.2); });
    act({who:"StockSense agent",what:`Forecast 3x normal ice and cold drinks at ${storeLabel(k.store)} this weekend`,reason:"Heat advisory Friday to Sunday (highs near 96°F) plus a home game Saturday",rule:"StockSense forecast v2.4",amount:null,acct:"Partner",store:k.store});
  }
  k.shortfalls = items.map(i=>({sku:i.sku,name:i.name,unit:i.unit,forecast:i.forecast,onHand:i.onHand,normal:i.normal,short:Math.max(0,i.forecast-i.onHand-i.incoming-i.onOrder)})).filter(x=>x.short>0);
  if (!k.shortfalls.length) { k.status="planned"; act({who:"Crew",what:`No stock-out risk at ${storeLabel(k.store)} this weekend`,reason:"On-hand stock and open orders cover the forecast",rule:"Stock-out risk v1.2",amount:null,acct:"Intuit",store:k.store}); return; }
  k.protected = Math.round(k.shortfalls.reduce((a,x)=>a+x.short*invItem(k.store,x.sku).retail,0)/100)*100;
  act({who:"Crew",what:`Found weekend shortfall at ${storeLabel(k.store)}: ${k.shortfalls.map(x=>`${x.name.split(",")[0].toLowerCase()} ${x.short} ${x.unit}`).join(", ")}`,reason:k.shortfalls.map(x=>`${x.name}: forecast ${x.forecast}, on hand ${x.onHand}`).join("; "),rule:"Stock-out risk v1.2",amount:null,acct:"Intuit",store:k.store});
  // transfers first: surplus at other stores in the same city
  const remaining = {};
  for (const x of k.shortfalls) {
    let need = x.short;
    for (const [sid, d] of Object.entries(S.inv)) {
      const o = store(+sid); if (+sid===k.store || o.city!==st.city || o.state!==st.state || need<=0) continue;
      const it = d.items.find(i=>i.sku===x.sku); if (!it) continue;
      const surplus = it.onHand - it.forecast; if (surplus<=0) continue;
      const qty = Math.min(surplus, need); need -= qty;
      k.transfers.push({ id:uid("tr"), sku:x.sku, name:it.name, unit:it.unit, from:+sid, to:k.store, qty, cost:Math.round(qty*it.cost*100)/100, crossEntity:o.entity!==st.entity, fromEntity:o.entity, status:"new" });
    }
    remaining[x.sku] = need;
  }
  // order the rest from the supplier
  const lines = k.shortfalls.filter(x=>remaining[x.sku]>0).map(x=>{ const it=invItem(k.store,x.sku); return {sku:x.sku,name:it.name,unit:it.unit,one:it.one,qty:remaining[x.sku],suggested:remaining[x.sku],cost:it.cost,step:it.step,supplier:it.supplier}; });
  for (const t of k.transfers) {
    if (s.transferAuto && s.mode!=="suggest") executeTransfer(t, null);
    else { t.status="pending"; S.approvals.push({id:uid("ap"),kind:"transfer",ref:t.id,approver:managerRole(k.store),status:"pending",ts:Date.now(),store:k.store}); }
  }
  if (lines.length) {
    const sup = SUPPLIERS[lines[0].supplier];
    const o = { id:"PO-"+(2300+S.orders.length), store:k.store, supplier:sup.name, supKey:lines[0].supplier, delivery:sup.delivery, lines, status:"pending", ts:Date.now(), heat:true };
    o.total = orderTotal(o); S.orders.push(o); k.orderId = o.id;
    const limit = s.mode==="suggest" ? -1 : s.mode==="auto" ? s.cfoOrderLimit : s.orderLimit;
    if (o.total <= limit) placeOrder(o, null);
    else {
      const who = o.total > s.cfoOrderLimit ? "mike" : managerRole(k.store);
      o.approver = who;
      S.approvals.push({id:uid("ap"),kind:"order",ref:o.id,approver:who,status:"pending",ts:Date.now(),store:k.store});
      act({who:"Crew",what:`Proposed order ${o.id} from ${o.supplier} for ${storeLabel(k.store)}`,reason:`${orderLinesText(o)}. ${money(o.total)} is ${s.mode==="suggest"?"waiting because every order is reviewed":o.total > s.cfoOrderLimit?`above your ${money(s.cfoOrderLimit)} limit`:`above the ${money(s.orderLimit)} auto-order limit`}. Arrives ${o.delivery}`,rule:"Stock-out risk v1.2 · auto-order rules v1.1",amount:o.total,acct:"Intuit",store:k.store});
      if (who==="mike" && S.role!=="mike") toast(`A supplier order for ${storeLabel(k.store)} is waiting in Approvals.`);
    }
  }
  k.status = "planned";
}
function orderLinesText(o){ return o.lines.filter(l=>l.qty>0).map(l=>`${l.qty} ${l.unit} of ${l.name.split(",")[0].toLowerCase()}`).join(" + "); }
function executeTransfer(t, by){
  const src = invItem(t.from, t.sku), dst = invItem(t.to, t.sku), to = store(t.to);
  src.onHand -= t.qty; dst.incoming += t.qty; t.status = "done"; t.doneAt = Date.now();
  S.approvals.filter(a=>a.ref===t.id && a.status==="pending").forEach(a=>{a.status="approved"; a.by=by; a.decidedAt=Date.now();});
  if (by) act({who:by,what:`Approved stock transfer: ${t.qty} ${t.unit} of ${t.name.split(",")[0].toLowerCase()} from ${storeLabel(t.from)}`,reason:"Transfers between stores need approval under current settings",rule:"Auto-order rules v1.1",amount:t.cost,acct:"CFO",store:t.to});
  const a = act({who:"Crew",what:`Moved ${t.qty} ${t.unit} of ${t.name.split(",")[0].toLowerCase()} from ${storeLabel(t.from)} to ${storeLabel(t.to)}`,reason:`${storeLabel(t.from)} has ${src.onHand+t.qty} on hand vs its own forecast of ${src.forecast}. Transferred at cost (${money(src.cost,true)} each)`,rule:"Stock transfer v1.0",amount:t.cost,acct:"Intuit",store:t.to,kind:"transfer",transferId:t.id});
  a.entryIds.push(post(t.to,`Inventory transfer in from ${storeLabel(t.from)}`,t.cost,a.id,{inv:true,memo:t.name}));
  a.entryIds.push(post(t.from,`Inventory transfer out to ${storeLabel(t.to)}`,t.cost,a.id,{inv:true,memo:t.name}));
  if (t.crossEntity) {
    const ic = act({who:"Crew",what:`Intercompany charge: ${to.entity} owes ${t.fromEntity}`,reason:`Stock moved from ${storeLabel(t.from)} (${t.fromEntity}) to ${storeLabel(t.to)} (${to.entity}) at cost`,rule:"Intercompany v2.3",amount:t.cost,acct:"Intuit",store:t.to,kind:"ic"});
    ic.entryIds.push(post(t.to,`Intercompany payable to ${t.fromEntity}`,t.cost,ic.id,{bs:true,inv:true,memo:"Stock transfer"}));
  }
}
function placeOrder(o, by, qtys){
  if (qtys) { o.lines.forEach((l,i)=>{ l.qty = Math.max(0, Math.round(+qtys[i]||0)); }); o.total = orderTotal(o); }
  o.status = "ordered"; o.orderedAt = Date.now(); o.by = by;
  S.approvals.filter(a=>a.ref===o.id && a.status==="pending").forEach(a=>{a.status="approved"; a.by=by; a.decidedAt=Date.now();});
  if (by) act({who:by,what:`Approved order ${o.id} from ${o.supplier}${qtys?" with changed quantities":""}`,reason:`${orderLinesText(o)}, ${money(o.total)}`,rule:"Auto-order rules v1.1",amount:o.total,acct:"CFO",store:o.store});
  const a = act({who:"Crew",what:`Sent purchase order ${o.id} to ${o.supplier} for ${storeLabel(o.store)}`,reason:`${orderLinesText(o)}. Arrives ${o.delivery}. ${by?"Approved by "+by:`Within the ${money(S.settings.mode==="auto"?S.settings.cfoOrderLimit:S.settings.orderLimit)} auto-order limit`}. Added to the cash forecast as committed`,rule:"Stock-out risk v1.2 · auto-order rules v1.1",amount:o.total,acct:"Intuit",store:o.store,kind:"order",orderId:o.id});
  a.entryIds.push(post(o.store,`Purchase order ${o.id} (committed)`,o.total,a.id,{inv:true,bs:true,commit:true,memo:o.supplier}));
  o.lines.forEach(l=>{ const it = l.sku && invItem(o.store,l.sku); if (it) it.onOrder += l.qty; });
}
function receiveOrder(id, by){
  const o = S.orders.find(x=>x.id===id); if (!o || o.status!=="ordered") return;
  o.status = "received"; o.receivedAt = Date.now();
  o.lines.forEach(l=>{ const it = l.sku && invItem(o.store,l.sku); if (it) { it.onOrder -= l.qty; it.onHand += l.qty; } });
  S.entries.filter(e=>e.commit && e.acct.includes(o.id) && !e.undone).forEach(e=>e.billed=true);
  act({who:by,what:`Marked delivery received: ${o.id} from ${o.supplier}`,reason:orderLinesText(o),rule:"Receiving v1.0",amount:null,acct:"CFO",store:o.store});
  const a = act({who:"Crew",what:`Posted supplier bill for ${o.id}: ${o.supplier}`,reason:`Delivery received at ${storeLabel(o.store)}; committed cash released and bill due in 30 days`,rule:"Accounts payable v3.1",amount:o.total,acct:"Intuit",store:o.store,kind:"bill",orderId:o.id});
  a.entryIds.push(post(o.store,`Supplier bill: ${o.supplier}`,o.total,a.id,{inv:true,memo:o.id}));
  save(); render(); toast("Delivery received. Supplier bill posted.");
}

function undoActivity(id){
  const a = S.activity.find(x=>x.id===id); if (!a || a.undone) return;
  a.undone = true;
  S.entries.filter(e=>a.entryIds.includes(e.id)).forEach(e=>e.undone=true);
  if (a.kind==="sick" && a.calloutId) { const c=S.callouts.find(x=>x.id===a.calloutId); if (c) { emp(c.empId).sick += c.sick.hours; c.sick.status="reversed"; } }
  const c = S.cases.find(x=>x.actId===id); if (c) c.adjustment = 0;
  if (a.kind==="order") { const o=S.orders.find(x=>x.id===a.orderId); if (o && o.status==="ordered") { o.status="cancelled"; o.lines.forEach(l=>{ const it=l.sku&&invItem(o.store,l.sku); if (it) it.onOrder-=l.qty; }); } }
  if (a.kind==="transfer") { const t=S.stock?.transfers.find(x=>x.id===a.transferId); if (t) { invItem(t.from,t.sku).onHand+=t.qty; invItem(t.to,t.sku).incoming-=t.qty; t.status="reversed"; } }

function toast(text, opt){

function feedCard(f){
  if (f.kind==="stock") return stockFeedCard(f);
  if (f.kind==="info") return `<div class="upd"><div class="when">${fmtTs(f.ts)}</div><div class="ttl">${esc(f.title)}</div><div class="body">${esc(f.body)}</div></div>`;
  if (f.kind==="callout") {
    const c = S.callouts.find(x=>x.id===f.ref); if (!c) return "";
    const e = emp(c.empId), q = c.quotes[c.pick];
    const head = `<div class="when">${fmtTs(f.ts)}</div>`;
    if (c.status==="searching"||c.status==="texting") return `<div class="upd">${head}<div class="ttl">${first(e.name)} called out for ${c.shift.label}.</div><div class="status-line"><span class="spin"></span>${esc(c.phase)}</div></div>`;
    if (c.status==="pending") {
      const ap = S.approvals.find(a=>a.ref===c.id && a.status==="pending");
      const txt = `${q.name}${q.home?` (Store ${q.home})`:""} can cover. ${money(q.total)}${q.otPrem?` incl. ${money(q.otPrem)} overtime`:""}.`;
      if (ap?.approver==="dana") return `<div class="upd amber">${head}<div class="ttl">${esc(txt)}</div><div class="body">Needs your OK: ${esc(reasonText(c))}</div>
        <div class="acts"><button class="btn primary" data-a="dapprove" data-v="${ap.id}">Approve cover</button><button class="btn" data-a="dother" data-v="${c.id}">Choose someone else</button></div>
        <div style="margin-top:10px"><button class="link small" data-a="dwhy" data-v="${c.id}">Why ${first(q.name)}?</button></div></div>`;
      return `<div class="upd">${head}<div class="ttl">${esc(txt)}</div><div class="body">Waiting for Mike Chen to approve.</div></div>`;
    }
    if (c.status==="covered") return `<div class="upd green">${head}<div class="ttl">${first(e.name)} called out for ${c.shift.label}.</div><div class="ok-line">${ICON.check.replace('<svg','<svg width="16" height="16"')}Covered. Payroll and books updated.</div><div class="body">${esc(q.name)} is on the schedule. ${first(e.name)}'s sick leave is ${c.sick.status==="approved"?"approved":"recorded"}.</div></div>`;
    if (c.status==="open") return `<div class="upd amber">${head}<div class="ttl">${first(e.name)}'s ${c.shift.label} shift is open.</div><div class="body">No one is scheduled. Crew will tell you if someone becomes available.</div></div>`;
    return "";
  }
  if (f.kind==="cash") {
    const c = S.cash.find(x=>x.id===f.ref); if (!c) return "";
    const head = `<div class="when">${fmtTs(f.ts)}</div>`;
    if (c.status==="closing") return `<div class="upd">${head}<div class="ttl">Closing out Register 2.</div><div class="status-line"><span class="spin"></span>Matching cash sales to safe drops...</div></div>`;
    if (c.status==="needsNote") return `<div class="upd amber">${head}<div class="ttl">Register 2 is ${money(c.gap)} short. Add a note for finance.</div>
      <div class="body">Cash sales ${money(c.pos)}, safe drops ${money(c.drops)}. This is the 3rd shortage on this register this month.</div>
      <label class="fld" style="margin-top:10px"><span>Note for finance</span><textarea id="note-${c.id}" placeholder="What happened at shift change?">${esc(c.note)}</textarea></label>
      <div class="acts"><button class="btn primary" data-a="cashsend" data-v="${c.id}">Send to finance</button></div></div>`;
    if (c.status==="sent") return `<div class="upd">${head}<div class="ttl">Register 2 shortage sent to finance.</div><div class="body">Your note: “${esc(c.note)}” Waiting for Mike Chen.</div></div>`;
    if (c.status==="approved") return `<div class="upd green">${head}<div class="ttl">Finance posted the Register 2 shortage.</div><div class="ok-line">${ICON.check.replace('<svg','<svg width="16" height="16"')}${money(c.gap)} posted to cash over/short.</div></div>`;
    if (c.status==="held") return `<div class="upd amber">${head}<div class="ttl">Finance asked for a recount of Register 2.</div><div class="body">Recount the drawer and safe before tonight's close.</div></div>`;
    if (c.status==="posted") return `<div class="upd green">${head}<div class="ttl">Register 2 closed ${money(c.gap)} short.</div><div class="ok-line">${ICON.check.replace('<svg','<svg width="16" height="16"')}Posted to cash over/short.</div></div>`;
  }
  return "";
}
function sheetWhy(cid){ return ()=>{ const c = S.callouts.find(x=>x.id===cid), q=c.quotes[c.pick], st=store(c.store);

function stockFeedCard(f){
  const k = S.stock; if (!k) return "";
  const head = `<div class="when">${fmtTs(f.ts)}</div>`;
  if (k.status==="forecasting") return `<div class="upd">${head}<div class="ttl">Checking this weekend's stock.</div><div class="status-line"><span class="spin"></span>Comparing the forecast with what's on the shelves...</div></div>`;
  const o = k.orderId && S.orders.find(x=>x.id===k.orderId);
  const needsDana = S.approvals.some(a=>a.status==="pending" && a.approver==="dana" && (a.kind==="order"||a.kind==="transfer"));
  const title = k.spike ? "Heatwave this weekend: ice and cold drinks will run out Saturday." : k.shortfalls.length ? "Weekend stock is running low." : "No stock-out risk this weekend.";
  const status = needsDana ? "An order needs your OK." : o && o.status==="ordered" ? `Order arrives ${o.delivery}.` : o && o.status==="received" ? "Delivery received." : k.transfers.length ? "Transfer on its way." : "";
  return `<div class="upd ${needsDana?"amber":"green"}">${head}<div class="ttl">${title}</div>${status?`<div class="body">${status}</div>`:""}<div class="acts"><button class="btn sm ${needsDana?"primary":""}" data-a="dtab" data-v="stock">Open Stock</button></div></div>`;
}
function danaStock(){
  const k = S.stock, items = S.inv[23].items;
  let cards = "";
  if (k && k.status==="forecasting") cards = `<div class="upd"><div class="ttl">Checking this weekend's stock.</div><div class="status-line"><span class="spin"></span>Comparing the forecast with what's on the shelves...</div></div>`;
  else if (k) {
    const when = `<div class="when">${fmtTs(k.ts)}</div>`;
    if (k.spike) cards += `<div class="upd ${k.shortfalls.length?"amber":""}">${when}<div class="ttl">Heatwave this weekend: ice and cold drinks will run out Saturday.</div><div class="body">Forecast is 3x normal for ice and cold drinks. Weekend sales protected: about ${money(k.protected)}.</div></div>`;
    for (const t of k.transfers) {
      const ap = S.approvals.find(a=>a.ref===t.id && a.status==="pending");

function previewCounts(s){

  let auto=212, cfo=0;
  if (!s.autoSick) auto-=41;
  if (!s.autoFillOT) auto-=33; else auto += Math.max(-24,Math.min(12,Math.round((s.otThreshold-100)/25)*3));
  if (s.crossEntity==="auto") auto+=9; if (s.crossEntity==="cfo") cfo+=9;
  if (s.crossState==="ask") cfo+=2; else auto+=2;

}

    <ul class="checks" style="margin-top:12px">${CHECKS.map(([l,v],i)=>`<li>${i<k?`<span class="tick">${ICON.check.replace('<svg','<svg width="12" height="12"')}</span>`:i===k?`<span class="spin" style="width:20px;height:20px"></span>`:`<span class="pend"></span>`}<span style="flex:1">${l}</span><b>${i<k?v:""}</b></li>`).join("")}</ul>
    ${S.sam.certified?`<button class="btn" style="margin-top:14px" data-a="sgo" data-v="publish">Continue to publish</button>`:""}</div></div>
    <div class="card">${hdr("What certification means","doc","blue")}<div class="pad"><p class="small muted">Customers see these results before they install. Intuit re-runs the checks on every new version.</p></div></div></div>`;
}
function sPublish(){
  const L = S.sam.listing;
  return `<div class="two"><div class="card">${hdr("Listing","doc","blue")}<div class="pad stack">
    <label class="fld"><span>Name</span><input type="text" data-lst="name" value="${esc(L.name)}"></label>
    <label class="fld"><span>One-line description</span><input type="text" data-lst="tagline" value="${esc(L.tagline)}"></label>
    <label class="fld"><span>Details</span><textarea data-lst="description" rows="5">${esc(L.description)}</textarea></label>
    <label class="fld"><span>Price per filled shift ($)</span><input type="number" min="1" data-lst="price" value="${L.price}" style="width:120px"></label>
    <div class="row">${S.sam.published?`<span class="badge green">Live in Marketplace</span><span class="spacer"></span><button class="btn" data-a="sunpub">Unpublish</button><button class="btn primary" data-a="spub">Update listing</button>`
      : S.sam.certified?`<span class="spacer"></span><button class="btn primary" data-a="spub">Publish listing</button>`:`<span class="small muted">Certify your agent to publish.</span>`}</div></div></div>
    <div><div class="small muted" style="margin-bottom:8px">Preview in Marketplace</div><div class="mk" style="grid-template-columns:1fr;max-width:320px"><div class="card"><div class="row"><div class="logo" style="background:#2A7F7A">SF</div><div><b id="pv-name">${esc(L.name)}</b><div class="small muted">by ShiftFill</div></div></div>
      <p class="small" style="margin:12px 0" id="pv-tag">${esc(L.tagline)}</p><div class="row"><span class="badge green">Certified</span><span class="small muted" id="pv-price">$${esc(L.price)} per filled shift</span></div></div></div></div></div>`;
}
function sEarn(){
  const inst = !!S.market.installed.shiftfill, price = S.sam.listing.price;
  const months = [["Apr",60],["May",140],["Jun",210],["Jul",250],["Aug",270],["Sep",310+S.sam.fills]];
  const shifts = months.reduce((a,m)=>a+m[1],0), thisMonth = months[months.length-1][1], gross = shifts*price;
  const max = Math.max(...months.map(m=>m[1]));
  return `<div class="card">${hdr("Earnings · since launch in April","cash","green")}<div class="grid tiles inner"><div class="tile"><div class="l">Chains installed</div><div class="v">${14+(inst?1:0)}</div>${inst?`<div class="s">Northway Fuel &amp; Market is new</div>`:""}</div><div class="tile"><div class="l">Shifts filled</div><div class="v">${shifts.toLocaleString()}</div><div class="s">${thisMonth} this month</div></div>
    <div class="tile"><div class="l">Gross billed</div><div class="v">${money(gross)}</div><div class="s">${money(thisMonth*price)} this month</div></div><div class="tile"><div class="l">Your share (80%)</div><div class="v v-good">${money(gross*.8)}</div><div class="s">Intuit (20%): ${money(gross*.2)}</div></div></div></div>
    <div class="two" style="margin-top:16px"><div class="card">${hdr("Shifts filled by month",'chart',"green",`<span class="meta">${shifts.toLocaleString()} since April</span>`)}<div class="pad"><div class="chart-wrap"><svg viewBox="0 0 420 180" role="img" aria-label="Shifts filled by month">${months.map(([m,v],i)=>{const h=v/max*120,x=20+i*66;return `<rect x="${x}" y="${150-h}" width="44" height="${h}" rx="4" fill="var(--green)"/><text x="${x+22}" y="${144-h}" text-anchor="middle" font-size="11" fill="var(--text)">${v}</text><text x="${x+22}" y="168" text-anchor="middle" font-size="11" fill="var(--muted)">${m}</text>`;}).join("")}</svg></div></div></div>
    <div class="card">${hdr("Usage","code","blue")}<div class="pad"><p>182K metered API calls this month; webhooks cut calls by about 70%.</p><p class="small muted" style="margin-top:8px">Payouts are monthly, on the 5th, for the previous month.</p></div></div></div>`;
}

/* ================= events ================= */
document.addEventListener("click", e=>{
  if (e.target.closest("[data-stop]") && !e.target.closest("[data-a]")) return;
  const el = e.target.closest("[data-a]");
  if (!el) { if (T.menu||T.sim) { T.menu=false; T.sim=false; render(); } return; }
  if (el.matches("[data-a='closesheet'],[data-a='closemodal']") && e.target.closest("[data-stop]") && el.closest("[data-stop]")!==null && !el.matches("button")) return;
  const a = el.dataset.a, v = el.dataset.v;
  const closeMenus = () => { T.menu=false; T.sim=false; };
  switch(a){
    case "menu": T.menu=!T.menu; T.sim=false; render(); break;
    case "simt": T.sim=!T.sim; T.menu=false; render(); break;
    case "role": closeMenus(); T.sheet=null; T.modal=null; S.role=v; S.ui.guide=false; save(); render(); window.scrollTo(0,0); break;
    case "guide": closeMenus(); T.sheet=null; T.modal=null; S.ui.guide=!S.ui.guide; S.ui.guideSeen=true; save(); render(); window.scrollTo(0,0); break;
    case "ggo": guideGo(v); break;
    case "gsim": { const map={maria:"dana:today",heat:"dana:stock",dispute:"priya",lena:"mike:store:41"}; guideGo(map[v]);
      if (v==="maria") eventCallout("maria"); else if (v==="lena") eventCallout("lena"); else if (v==="heat") eventHeatwave(); else if (v==="dispute") eventDispute(); break; }
    case "sim": closeMenus();
      if (v==="reset") { S.jobs=[]; const role=S.role, g=S.ui.guide; S = initialState(); S.role=role; S.ui.guide=g; S.ui.guideSeen=true; T.sheet=null; T.modal=null; T.pick=null; T.consent=false; T.runLines=null; save(); render(); toast("All data reset."); }
      else if (v==="maria") eventCallout("maria"); else if (v==="lena") eventCallout("lena"); else if (v==="heat") eventHeatwave(); else if (v==="dispute") eventDispute();
      render(); break;
    // Dana
    case "dtab": S.ui.dana.tab=v; T.sheet=null; save(); render(); break;
    case "thread": S.ui.dana.thread=v||null; save(); render(); { const b=document.querySelector("[data-keep='dana-thread']"); if (b) b.scrollTop=b.scrollHeight; } break;
    case "sms": { const inp=$("#sms-in"); if (inp.value.trim()) { sms(v,"dana",inp.value.trim()); save(); render(); const b=document.querySelector("[data-keep='dana-thread']"); if (b) b.scrollTop=b.scrollHeight; } break; }
    case "dwhy": T.sheet = sheetWhy(v); render(); break;
    case "dother": T.sheet = sheetOther(v,"Dana Brooks"); render(); break;
    case "dapprove": approveCover(v,"Dana Brooks"); toast("Cover approved."); break;
    case "closesheet": if (e.target===el || el.tagName==="BUTTON") { T.sheet=null; render(); } break;
    case "pick": T.sheet=null; T.modal=null; chooseOther(v, +el.dataset.i, el.dataset.by); break;
    case "leave": T.sheet=null; T.modal=null; chooseOther(v, -1, el.dataset.by); break;
    case "cashsend": sendCashNote(v); break;
    case "tapprove": approveTransferAp(v,"Dana Brooks"); break;
    case "oapprove": approveOrderAp(v,"Dana Brooks"); break;
    case "oqty": T.sheet = sheetQty(v,"Dana Brooks"); render(); break;
    case "owhy": T.sheet = sheetWhyOrder(); render(); break;
    case "orecv": receiveOrder(v,"Dana Brooks"); break;
    case "qstep": { const inp=document.getElementById("qty-"+el.dataset.i); inp.value=Math.max(0,(+inp.value||0)+(+el.dataset.d)); const oid=(document.querySelector("[data-qty]")||{}).dataset?.o; if (oid) qtyTotal(oid); break; }
    case "qapprove": { const o=S.orders.find(x=>x.id===v); const q=o.lines.map((l,i)=>+document.getElementById("qty-"+i).value); T.sheet=null; T.modal=null; renderOverlay(); approveOrderAp(v, el.dataset.by, q); break; }
    case "mapporder": approveOrderAp(v,"Mike Chen"); break;
    case "mtapprove": approveTransferAp(v,"Mike Chen"); break;
    case "mqty": T.modal = ()=>`<div class="scrim center" data-a="closemodal"><div class="modal" data-stop role="dialog" aria-modal="true">${sheetQty(v,"Mike Chen")()}<button class="btn block" style="margin-top:8px" data-a="closemodal">Cancel</button></div></div>`; renderOverlay(); break;
    case "goorders": goMike({view:"activity",actStore:"all",actWho:"all",actKind:"inv"}); break;
    // Mike
    case "mnav": S.ui.mike.view=v; S.ui.mike.market=null; T.pick=null; T.consent=false; if (v==="stores") S.ui.mike.over=S.ui.mike.over; save(); render(); window.scrollTo(0,0); break;
    case "store": goMike({view:"store",store:+v}); break;
    case "overonly": S.ui.mike.over=true; goMike({view:"stores"}); break;
    case "goact": goMike({view:"activity",actStore:v,actWho:"all",actKind:"all"}); break;
    case "goactrow": S.ui.mike.flashRow=v; S.ui.mike.flash=v; goMike({view:"activity",actStore:"all",actWho:"all"}); setTimeout(()=>{S.ui.mike.flashRow=null;},2500); break;
    case "sort": { const s=S.ui.mike.sort; if (s.k===v) s.d*=-1; else { s.k=v; s.d=["id","city","entity"].includes(v)?1:-1; } save(); render(); break; }
    case "mapprove": approveCover(v,"Mike Chen"); toast("Cover approved."); break;
    case "whym": T.modal = ()=>`<div class="scrim center" data-a="closemodal"><div class="modal" data-stop role="dialog" aria-modal="true">${sheetWhy(v)().replace('data-a="closesheet"','data-a="closemodal"')}</div></div>`; renderOverlay(); break;
    case "mother": T.modal = ()=>`<div class="scrim center" data-a="closemodal"><div class="modal" data-stop role="dialog" aria-modal="true">${sheetOther(v,"Mike Chen")()}<button class="btn block" style="margin-top:8px" data-a="closemodal">Cancel</button></div></div>`; renderOverlay(); break;
    case "closemodal": if (e.target===el || el.tagName==="BUTTON") { T.modal=null; renderOverlay(); } break;
    case "cashok": approveCash(v,false); break;
    case "cashhold": approveCash(v,true); break;
    case "undo": undoActivity(v); break;
    case "mkt": goMike({view:"marketplace",market:(v==="shiftfill"&&!S.sam.published)?null:v}); break;
    case "allil": T.showAllIL=!T.showAllIL; render(); break;
    case "install": if (!T.consent) break; installPartner(v, v==="shiftfill" ? [...T.pick].sort((x,y)=>x-y) : "all"); T.consent=false; break;
    case "uninstall": uninstallPartner(v); T.pick=null; break;
    case "mode": S.settings.mode=v; act({who:"Mike Chen",what:`Changed Crew mode to ${({suggest:"Suggest only",act:"Act & notify",auto:"Fully automatic"})[v]}`,reason:"Crew settings",rule:"Settings v1",amount:null,acct:"CFO",store:null}); save(); render(); break;
    case "resetset": S.settings={...DEFAULT_SETTINGS}; act({who:"Mike Chen",what:"Restored default Crew settings",reason:"Crew settings",rule:"Settings v1",amount:null,acct:"CFO",store:null}); save(); render(); break;
    case "ask": ask(v); break;
    case "asksend": { const i=$("#ask-in"); const q=i.value; i.value=""; ask(q); break; }
    case "go": go(v); break;
    // Priya
    case "case": S.ui.priya.caseId=v; save(); render(); break;
    case "cdec": T.modal = caseModal(S.ui.priya.caseId || S.cases[0].id, v); renderOverlay(); $("#case-msg")?.focus(); break;
    case "csend": { const txt=$("#case-msg").value.trim(); T.modal=null; renderOverlay(); resolveCase(v, el.dataset.c, txt); break; }
    // Sam
    case "sstep": S.ui.sam.step=v; save(); render(); break;
    case "sgo": S.ui.sam.step=v; S.sam.max=Math.max(S.sam.max, STEPS.findIndex(s=>s[0]===v)); save(); render(); window.scrollTo(0,0); break;
    case "ssandbox": S.sam.sandbox=true; S.ui.sam.step="sandbox"; S.sam.max=Math.max(S.sam.max,1); save(); render(); break;
    case "sev": S.ui.sam.buildTab=v; save(); render(); break;
    case "srun": runSandbox(); break;
    case "scert": runCert(); break;
    case "spub": S.sam.published=true; S.sam.max=5; save(); render(); toast("Published. ShiftFill is live in the IES Marketplace."); break;
    case "sunpub": S.sam.published=false; save(); render(); toast("Unpublished."); break;
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.dataset.set) { const k=el.dataset.set; const old=S.settings[k];
    S.settings[k] = el.type==="checkbox" ? el.checked : el.type==="number" ? Math.max(0,+el.value||0) : el.value;
    const label = {transferAuto:"Transfer stock automatically",orderLimit:"Auto-order limit",cfoOrderLimit:"CFO approves orders above",autoSick:"Auto-approve sick leave",autoFillOT:"Auto-fill overtime limit",otThreshold:"Overtime premium limit",crossEntity:"Staff from another entity",crossState:"Cover from another state",cashThreshold:"Cash variance threshold",disputes:"Pay dispute routing"}[k];
    act({who:"Mike Chen",what:`Changed setting: ${label}`,reason:`${String(old)} → ${String(S.settings[k])}`,rule:"Settings v1",amount:null,acct:"CFO",store:null});
    save(); render(); return; }
  const a2 = el.dataset.a2;
  if (a2==="entity") { S.ui.mike.entity=el.value; save(); render(); }
  else if (a2==="over") { S.ui.mike.over=el.checked; save(); render(); }
  else if (a2==="actStore") { S.ui.mike.actStore=el.value; save(); render(); }
  else if (a2==="actWho") { S.ui.mike.actWho=el.value; save(); render(); }
  else if (a2==="actKind") { S.ui.mike.actKind=el.value; save(); render(); }
  else if (a2==="pick") { el.checked ? T.pick.add(+el.value) : T.pick.delete(+el.value); render(); }
  else if (a2==="consent") { T.consent=el.checked; render(); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if (el.dataset.a2==="q") { S.ui.mike.q=el.value; const pos=el.selectionStart; render(); const n=document.querySelector("[data-a2='q']"); if (n){ n.focus(); n.setSelectionRange(pos,pos);} }
  if (el.dataset.lst) { const k=el.dataset.lst; S.sam.listing[k] = k==="price" ? Math.max(1,+el.value||1) : el.value; save();
    if (k==="name") $("#pv-name").textContent=el.value; if (k==="tagline") $("#pv-tag").textContent=el.value; if (k==="price") $("#pv-price").textContent="$"+el.value+" per filled shift"; }
  if (el.dataset.qty!==undefined) qtyTotal(el.dataset.o);
  if (el.id && el.id.startsWith("note-")) { const c=S.cash.find(x=>"note-"+x.id===el.id); if (c) { c.note=el.value; save(); } }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Enter" && e.target.id==="ask-in") { const q=e.target.value; e.target.value=""; ask(q); }
  if (e.key==="Enter" && e.target.id==="sms-in") document.querySelector("[data-a='sms']")?.click();
  if (e.key==="Escape") { if (T.modal) { T.modal=null; renderOverlay(); } else if (T.sheet||T.menu||T.sim) { T.sheet=null; T.menu=false; T.sim=false; render(); } }
});

function runSandbox(){
  T.run=true; T.runLines=[]; render();
  const lines = [
    '<span class="dim">Connected to Sandbox Fuel Co. (60 stores)</span>',
    '<span class="ev">shift.uncovered</span> st_041 Chicago, cashier 2 PM–10 PM, fuel_till',
    '<span class="ok">proposed</span> worker wk_2231, eta 38 min, $28.00/h, no overtime',
    '<span class="ev">shift.uncovered</span> st_044 Chicago, cashier 6 AM–2 PM',
    '<span class="ok">proposed</span> worker wk_1904, eta 45 min, $28.00/h',
    '<span class="ev">shift.uncovered</span> st_017 Columbus, cashier 10 AM–6 PM',
    '<span class="dim">skipped: store not in install scope</span>',
    '<span class="ev">shift.uncovered</span> st_058 Chicago, cashier 2 PM–10 PM, fuel_till',
    '<span class="ok">proposed</span> worker wk_2310, eta 41 min, $28.00/h',
    '<span class="ev">payroll.adjusted</span> sh_88213 posted, reversible until Fri 5 PM',
    '<span class="ok">done</span> 4 events, 3 proposals, avg response 1.7 s',
  ];
  let i=0; const iv=setInterval(()=>{ T.runLines.push(lines[i++]); const lg=$("#runlog"); if (lg){ lg.innerHTML=T.runLines.join("<br>"); lg.scrollTop=lg.scrollHeight; }
    if (i>=lines.length){ clearInterval(iv); T.run=null; S.sam.ran=true; S.sam.max=Math.max(S.sam.max,3); save(); render(); const l=$("#runlog"); if(l) l.scrollTop=l.scrollHeight; } }, 450);
}
function runCert(){
  T.cert=0; render();
  const iv=setInterval(()=>{ T.cert++; if (T.cert>=CHECKS.length){ clearInterval(iv); T.cert=null; S.sam.certified=true; S.sam.max=Math.max(S.sam.max,4); save(); } render(); }, 650);
}

// Resume work that was in flight before a reload
S.jobs.forEach(j=>{ if (j.dueAt < Date.now()) j.dueAt = Date.now()+600; });
render();
</script>
